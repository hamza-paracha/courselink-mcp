[project]
name = "courselink-mcp"
version = "0.1.0"
authors = [{ name = "hamza-paracha" }]
description = "CourseLink monitor, versioned downloads, and MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp>=1.20,<2",
    "playwright>=1.55,<2",
    "httpx>=0.28,<1",
    "uvicorn>=0.35,<1",
    "pypdf>=6,<7",
]

[project.scripts]
courselink = "courselink_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
